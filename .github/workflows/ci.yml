name: CI

# Ordem obrigatória (SPEC §1.2): lint, typecheck, testes unitários, testes de a11y, testes de
# RLS, supabase db push. Nenhum deploy passa com qualquer etapa vermelha — cada job depende do
# anterior via `needs`. O job `ci-gate` é o único que deve virar "required status check" na
# branch protection do GitHub (pendência registrada em docs/ops/divida-tecnica.md) — ver o
# comentário no próprio job para o motivo de não ser `rls-test` diretamente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A versão do pnpm NÃO se declara aqui. `pnpm/action-setup@v4` recusa rodar quando encontra
  # duas fontes de verdade (`with: version:` no workflow E `packageManager` no package.json) —
  # foi exatamente isso que deixou a `main` vermelha no primeiro push ao GitHub, com o job de
  # lint morrendo antes de instalar qualquer coisa e todos os seguintes em `skipped`. A fonte
  # única é `package.json` → `"packageManager"`, que é também o que o `corepack` local respeita.
  # Node alinhado com a máquina onde a suíte foi provada (v24) — CI num Node diferente do de
  # desenvolvimento é um buraco no que o CI prova.
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-test:
    name: Testes unitários (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  a11y-test:
    name: Testes de acessibilidade (Playwright + axe)
    runs-on: ubuntu-latest
    needs: unit-test
    # Os testes de a11y não tocam banco (ver playwright.config.ts), mas o app não sobe sem
    # estas duas variáveis: `proxy.ts` constrói um cliente Supabase em TODA requisição para
    # renovar a sessão, e `createServerClient` lança "Your project's URL and Key are required"
    # quando elas faltam — /design-system vira 500 antes de renderizar qualquer coisa. Medido
    # nesta máquina: com as variáveis abaixo, 200; sem elas, 500.
    #
    # Os valores são falsos e a porta é inalcançável de propósito. `getUser()` falha a
    # requisição de rede e devolve usuário nulo, que é exatamente o estado que a página
    # pública espera. Se um teste de a11y um dia precisar de banco de verdade, ele quebra
    # aqui — em vez de passar por acidente apontando para dado real.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:59999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-falsa-sem-banco-atras
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls-test:
    name: Testes de RLS (pgTAP)
    runs-on: ubuntu-latest
    needs: a11y-test
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `pg_prove` (harness TAP) não vem com o runner nem com o Supabase CLI — é o mesmo
      # pacote Perl que o auditor-rls usou para validar a suíte localmente
      # (TAP::Parser::SourceHandler::pgTAP). Tenta o pacote do sistema primeiro (mais rápido,
      # não depende de mirror do CPAN); cai para cpanm só se o apt não tiver o pacote nesta
      # imagem de runner.
      - name: Instalar pg_prove
        run: |
          set -euo pipefail
          if sudo apt-get update && sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl; then
            echo "pg_prove instalado via apt (libtap-parser-sourcehandler-pgtap-perl)."
          else
            echo "Pacote apt indisponível nesta imagem — instalando via cpanm (CPAN)."
            command -v cpanm >/dev/null 2>&1 || curl -fsSL https://cpanmin.us | sudo perl - App::cpanminus
            sudo cpanm --notest TAP::Parser::SourceHandler::pgTAP
          fi
          pg_prove --version
      # `supabase start` sobe o stack local (Postgres + extensões) e aplica todas as migrações
      # versionadas em supabase/migrations antes de qualquer teste — inclusive
      # 20260904122300_pgtap_test_only.sql, que instala a extensão pgtap. Esse arquivo é
      # correto AQUI (local/CI); ele é filtrado no job db-push antes de tocar produção — ver
      # comentário no passo "Filtrar migrações de teste" abaixo.
      - name: Start Supabase local
        run: supabase start
      # Suíte real do auditor-rls em supabase/tests/01..05*.sql. Sem condicional de "se vazio,
      # pula" — a suíte existe, e o job PRECISA ficar vermelho no primeiro assert que quebrar.
      # Aprovada na 4ª rodada de auditoria em 2026-09-04 (176/176, determinístico em 3
      # execuções — docs/auditoria/veredito-f0.md). Esse veredito só vale para sempre se este
      # job continuar rodando a cada alteração de migração e barrando regressão — é o que o
      # job ci-gate, logo abaixo, existe para garantir de verdade (não só "roda e reporta").
      - name: Rodar testes pgTAP de RLS
        run: supabase test db --local supabase/tests
      - name: Parar Supabase local
        if: always()
        run: supabase stop

  # ---------------------------------------------------------------------------------------
  # Gate único de merge. Existe por um motivo específico, não decorativo: com `needs` em
  # cadeia, se `lint` falhar, os jobs seguintes (typecheck, unit-test, a11y-test, rls-test)
  # ficam com status SKIPPED — e o GitHub trata "skipped" como requisito satisfeito em branch
  # protection por padrão. Ou seja: exigir só `rls-test` como status check obrigatório NÃO
  # barra o merge se `lint` (ou qualquer job anterior na cadeia) quebrar — o PR aparenta estar
  # verde. `ci-gate` roda sempre (`if: always()`), inspeciona o resultado de cada job da
  # cadeia via `needs.*.result` e falha de verdade (não "pula") se qualquer um não foi
  # `success`. É ESTE job — e só ele — que deve ser marcado como "required status check" na
  # branch protection do repositório quando ele existir no GitHub (ver README.md, seção CI/CD,
  # e a pendência registrada em docs/ops/divida-tecnica.md).
  # ---------------------------------------------------------------------------------------
  ci-gate:
    name: CI gate (obrigatório para merge)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, a11y-test, rls-test]
    if: always()
    steps:
      - name: Falhar se qualquer job da cadeia não passou
        run: |
          echo '${{ toJSON(needs) }}' | jq .
          if echo '${{ toJSON(needs) }}' | jq -e 'to_entries[] | select(.value.result != "success")' > /dev/null; then
            echo "::error::Um ou mais jobs da cadeia (lint/typecheck/unit-test/a11y-test/rls-test) não passaram (falhou ou foi pulado) — isto tem que barrar o merge."
            exit 1
          fi
          echo "Todos os jobs da cadeia passaram de verdade."

  db-push:
    name: supabase db push (deploy)
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      # ---------------------------------------------------------------------------------
      # Ainda NÃO existe projeto Supabase hospedado (dívida D2; a criação é o item A1 do
      # Portão A em docs/juridico/pareceres/2026-09-07-producao-dado-real-supabase-vercel.md,
      # e é ação da dona do projeto, não deste workflow). Sem os secrets, `link` falharia com
      # project-ref vazio e deixaria a `main` permanentemente vermelha por um motivo que não é
      # defeito de código — ruído que treina todo mundo a ignorar o X.
      #
      # Este passo é o oposto de um `continue-on-error` silencioso: ele DIZ, no log e no
      # sumário do run, que o deploy não aconteceu e por quê. E não afrouxa nada do que
      # importa: `db-push` nunca fez parte de `ci-gate` (o required status check) — a cadeia
      # lint→typecheck→unit→a11y→rls continua barrando merge com a mesma dureza.
      #
      # No dia em que os três secrets existirem, este passo passa a ser um no-op e o deploy
      # roda sozinho. Não há flag para lembrar de virar.
      # ---------------------------------------------------------------------------------
      - name: Verificar se o projeto remoto já existe
        id: pre
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          faltando=()
          [ -n "${SUPABASE_PROJECT_ID:-}" ]    || faltando+=("SUPABASE_PROJECT_ID")
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]  || faltando+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]   || faltando+=("SUPABASE_DB_PASSWORD")
          if [ "${#faltando[@]}" -eq 0 ]; then
            echo "tem_remoto=true" >> "$GITHUB_OUTPUT"
            echo "Secrets presentes — migrações serão aplicadas no projeto remoto."
          else
            echo "tem_remoto=false" >> "$GITHUB_OUTPUT"
            printf 'Secrets ausentes: %s\n' "${faltando[*]}"
            echo "::warning title=Deploy de schema NÃO executado::Não há projeto Supabase hospedado (dívida D2 / Portão A, item A1). As migrações desta push NÃO foram aplicadas em lugar nenhum além do CI local. Secrets ausentes: ${faltando[*]}"
            {
              echo "### Deploy de schema não executado"
              echo
              echo "Não há projeto Supabase hospedado. Migrações desta push ficaram apenas no repositório."
              echo
              echo "Secrets ausentes: \`${faltando[*]}\`"
              echo
              echo "Fecha com o item **A1** do Portão A — \`docs/juridico/pareceres/2026-09-07-producao-dado-real-supabase-vercel.md\` — e a dívida **D2** de \`docs/ops/divida-tecnica.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.pre.outputs.tem_remoto == 'true'
        with:
          version: latest
      # Filtro obrigatório antes de qualquer push remoto. `20260904122300_pgtap_test_only.sql`
      # (e qualquer futura migração terminada em `_test_only.sql`) instala a extensão pgtap —
      # necessária em local/CI para o job rls-test, mas NUNCA em staging/produção: extensão de
      # teste é superfície de ataque desnecessária num banco real (o próprio arquivo documenta
      # essa regra). Isto NÃO é bug nem esquecimento — é filtro de propósito. Se você está lendo
      # isto porque o arquivo "sumiu" do deploy, é intencional; não remova este passo.
      #
      # Mecanismo: copia supabase/config.toml + todas as migrações, exceto *_test_only.sql,
      # para um workdir temporário, e aponta `supabase --workdir` para ele em todos os passos
      # seguintes — o diretório `supabase/migrations` do checkout original nunca é tocado.
      - name: Filtrar migrações de teste (*_test_only.sql) antes do deploy
        if: steps.pre.outputs.tem_remoto == 'true'
        run: |
          set -euo pipefail
          DEPLOY_ROOT="$(mktemp -d)"
          mkdir -p "$DEPLOY_ROOT/supabase/migrations"
          cp supabase/config.toml "$DEPLOY_ROOT/supabase/config.toml"

          shopt -s nullglob
          skipped=()
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            if [[ "$base" == *_test_only.sql ]]; then
              skipped+=("$base")
              continue
            fi
            cp "$f" "$DEPLOY_ROOT/supabase/migrations/$base"
          done

          echo "DEPLOY_WORKDIR=$DEPLOY_ROOT" >> "$GITHUB_ENV"
          if [ "${#skipped[@]}" -eq 0 ]; then
            echo "Nenhuma migração *_test_only.sql encontrada — nada para filtrar desta vez."
          else
            echo "Migrações puladas no deploy remoto (extensão/dado só de teste):"
            printf '  - %s\n' "${skipped[@]}"
          fi
      # Requer secrets configurados no repositório (ver docs/ops/backup.md e pendências no
      # relatório de entrega do devops): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
      # SUPABASE_PROJECT_ID. Schema nunca é editado pelo dashboard — só migração versionada.
      - name: Link ao projeto remoto
        if: steps.pre.outputs.tem_remoto == 'true'
        run: supabase --workdir "$DEPLOY_WORKDIR" link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Aplicar migrações no remoto (sem *_test_only.sql)
        if: steps.pre.outputs.tem_remoto == 'true'
        run: supabase --workdir "$DEPLOY_WORKDIR" db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Tipos gerados no CI (SPEC §1.2), publicados como artefato — não commitados de volta
      # automaticamente nesta fase (F0). Baixar e commitar manualmente até isso virar um passo
      # de bot dedicado.
      - name: Gerar tipos TS a partir do schema remoto
        if: steps.pre.outputs.tem_remoto == 'true'
        run: supabase --workdir "$DEPLOY_WORKDIR" gen types typescript --linked > database.types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: steps.pre.outputs.tem_remoto == 'true'
        with:
          name: database-types
          path: database.types.ts
